<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>UniVerify Admin Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0A1929;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#0D2137;border:1px solid #1A3A5C;border-radius:16px;max-width:400px;width:100%;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
    .logo{font-size:24px;font-weight:700;color:#fff;margin-bottom:4px}
    .logo span{color:#B8860B}
    .tag{display:inline-block;font-size:10px;font-weight:700;color:#B8860B;background:#1A3A5C;padding:3px 10px;border-radius:10px;letter-spacing:1px;margin-bottom:24px;margin-top:6px}
    label{display:block;font-size:11px;font-weight:600;color:#8AADCC;margin-bottom:5px;margin-top:16px;text-transform:uppercase;letter-spacing:0.5px}
    input{width:100%;padding:10px 14px;background:#061525;border:1.5px solid #1A3A5C;border-radius:8px;font-size:14px;color:#fff;font-family:inherit;outline:none;transition:border 0.2s}
    input:focus{border-color:#B8860B}
    .btn{width:100%;padding:12px;background:#B8860B;color:#0A1929;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:24px;font-family:inherit}
    .btn:hover{background:#D4A017}
    .btn:disabled{background:#555;color:#888;cursor:not-allowed}
    .err{font-size:12px;color:#f5c6c6;margin-top:10px;padding:8px 12px;background:#5A1A1A;border-radius:6px;display:none}
    .err.show{display:block}
    .spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(10,25,41,0.4);border-top-color:#0A1929;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .note{font-size:11px;color:#555;text-align:center;margin-top:20px}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Uni<span>Verify</span></div>
  <div class="tag">INNOVATION LENS ADMIN</div>

  <label>Username</label>
  <input type="text" id="username" placeholder="Admin username" autocomplete="username"/>
  <label>Password</label>
  <input type="password" id="password" placeholder="Admin password" autocomplete="current-password"/>

  <button class="btn" id="login-btn">Access Admin Panel</button>
  <p class="err" id="err-msg"></p>

  <p class="note">Restricted access. Innovation Lens personnel only.</p>
</div>

<script>
  const redirect = new URLSearchParams(window.location.search).get('redirect') || '/admin';

  async function doLogin() {
    const btn      = document.getElementById('login-btn');
    const err      = document.getElementById('err-msg');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    err.classList.remove('show');

    if (!username || !password) {
      err.textContent = 'Please enter your credentials.';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Verifying...';

    try {
      const res  = await fetch('/admin-api/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (res.ok && data.success) {
        window.location.href = redirect;
      } else {
        err.textContent = data.error || 'Invalid credentials.';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Access Admin Panel';
      }
    } catch (e) {
      err.textContent = 'Network error. Please try again.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Access Admin Panel';
    }
  }

  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
